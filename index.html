<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endless Sky</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            outline: none;
        }

        #status {
            color: #fff;
            font-family: sans-serif;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
        }

        /* On-screen debug console */
        #debug-console {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            font-family: monospace;
            font-size: 14px;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            z-index: 9999;
            white-space: pre-wrap;
            word-wrap: break-word;
            display: block; /* Visible by default to catch early initialization */
        }
    </style>
</head>

<body>
    <div id="status">Loading environment hacks...</div>
    <div id="debug-console"></div>
    <canvas id="canvas" tabindex="0"></canvas>

    <!-- Logging Interceptor (MUST BE FIRST) -->
    <script>
        const debugConsole = document.getElementById('debug-console');
        
        function formatArgs(args) {
            return args.map(a => {
                if (a instanceof Error) return a.stack || a.message;
                if (typeof a === 'object') return JSON.stringify(a);
                return String(a);
            }).join(' ');
        }

        function printToScreen(msg, color) {
            const span = document.createElement('span');
            span.style.color = color;
            span.innerText = msg + '\n';
            debugConsole.appendChild(span);
            debugConsole.scrollTop = debugConsole.scrollHeight;
        }

        const origLog = console.log;
        console.log = function(...args) {
            origLog.apply(console, args);
            printToScreen(formatArgs(args), '#0f0'); // Green for standard logs
        };

        const origWarn = console.warn;
        console.warn = function(...args) {
            origWarn.apply(console, args);
            printToScreen(formatArgs(args), '#ff0'); // Yellow for warnings
        };

        const origError = console.error;
        console.error = function(...args) {
            origError.apply(console, args);
            printToScreen(formatArgs(args), '#f00'); // Red for errors
        };

        window.addEventListener('error', function(e) {
            console.error("Global Error:", e.message, "at", e.filename, ":", e.lineno);
        });

        window.addEventListener('unhandledrejection', function(e) {
            console.error("Unhandled Promise Rejection:", e.reason);
        });
    </script>

    <script>
        window.coi = {
            // FIXED: Must be true for GitHub Pages to allow cross-origin isolation
            coepCredentialless: () => true
        };
    </script>
    <script src="coi-serviceworker.js"></script>
    <script src="data-reassembler.js"></script>

    <script>
        if (WebAssembly.instantiateStreaming) {
            const originalInstantiateStreaming = WebAssembly.instantiateStreaming;
            WebAssembly.instantiateStreaming = function(response, imports) {
                if (imports && imports.env && imports.env.pthread_create) {
                    console.warn("[Hack] Intercepting imports.env.pthread_create (streaming)");
                    imports.env.pthread_create = function() { return 0; };
                }
                return originalInstantiateStreaming(response, imports);
            };
        }

        var Module = {
            canvas: document.getElementById("canvas"),
            setStatus: function(text) {
                var statusEl = document.getElementById("status");
                if (statusEl) {
                    if (text) {
                        statusEl.innerText = text;
                        console.log("[Status]", text);
                    } else {
                        statusEl.style.display = "none";
                    }
                }
            }
        };

        function loadGameScript() {
            console.log("Cross-origin isolation confirmed. Injecting data loader...");
            
            // 1. First, load the data fetcher script generated by the file_packager
            var dataLoader = document.createElement("script");
            dataLoader.src = "endless-sky.data.js?t=" + new Date().getTime();
            
            dataLoader.onload = function() {
                console.log("Data loader active. Injecting main engine...");
                
                // 2. Once the loader is ready, load the main WebAssembly engine
                var script = document.createElement("script");
                script.src = "endless-sky.js?t=" + new Date().getTime();
                document.body.appendChild(script);
            };
            
            // Start the loading sequence
            document.body.appendChild(dataLoader);
        }
        if (window.crossOriginIsolated) {
            loadGameScript();
        } else {
            console.warn("[COI] Waiting for Cross-Origin Isolation reload...");
            setTimeout(function() {
                if (!window.crossOriginIsolated) {
                    console.error("Cross-Origin Isolation failed. Check browser restrictions.");
                    document.getElementById("status").innerText = 
                        "Cross-Origin Isolation failed. Check browser restrictions.";
                }
            }, 3000);
        }
    </script>
</body>
</html>
