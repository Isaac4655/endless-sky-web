<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Endless Sky</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            outline: none;
        }
    </style>
</head>

<body>
    <canvas id="canvas" tabindex="0"></canvas>

    <!-- Must load before anything else: registers a service worker that injects the
         Cross-Origin-Opener-Policy / Cross-Origin-Embedder-Policy headers that GitHub Pages
         won't let us set server-side. Required for SharedArrayBuffer / pthreads to work.
         On first load it will register the worker and reload the page once automatically. -->
    <script src="coi-serviceworker.js"></script>

    <!-- Must load before endless-sky.js: patches fetch/XHR so that any request for
         "endless-sky.data" is transparently reassembled from the 16 split part files
         in data/endless-sky.data.part00 .. part15 (GitHub's file size limits forced the split). -->
    <script src="data-reassembler.js"></script>

    <script>
        var Module = {
            canvas: document.getElementById("canvas")
        };
    </script>

    <script src="endless-sky.js"></script>
</body>
</html>
