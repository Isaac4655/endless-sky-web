<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endless Sky</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            outline: none;
        }

        #status {
            color: #fff;
            font-family: sans-serif;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
        }

        /* On-screen debug console */
        #debug-console {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            font-family: monospace;
            font-size: 14px;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            z-index: 9999;
            white-space: pre-wrap;
            word-wrap: break-word;
            display: block; /* Visible by default to catch early initialization */
        }
    </style>
</head>

<body>
    <div id="status">Loading environment hacks...</div>
    <div id="debug-console"></div>
    <canvas id="canvas" tabindex="0"></canvas>

    <!-- Logging Interceptor (MUST BE FIRST) -->
    <script>
        const debugConsole = document.getElementById('debug-console');
        
        function formatArgs(args) {
            return args.map(a => {
                if (a instanceof Error) return a.stack || a.message;
                if (typeof a === 'object') return JSON.stringify(a);
                return String(a);
            }).join(' ');
        }

        function printToScreen(msg, color) {
            const span = document.createElement('span');
            span.style.color = color;
            span.innerText = msg + '\n';
            debugConsole.appendChild(span);
            debugConsole.scrollTop = debugConsole.scrollHeight;
        }

        const origLog = console.log;
        console.log = function(...args) {
            origLog.apply(console, args);
            printToScreen(formatArgs(args), '#0f0'); // Green for standard logs
        };

        const origWarn = console.warn;
        console.warn = function(...args) {
            origWarn.apply(console, args);
            printToScreen(formatArgs(args), '#ff0'); // Yellow for warnings
        };

        const origError = console.error;
        console.error = function(...args) {
            origError.apply(console, args);
            printToScreen(formatArgs(args), '#f00'); // Red for errors
        };

        window.addEventListener('error', function(e) {
            console.error("Global Error:", e.message, "at", e.filename, ":", e.lineno);
        });

        window.addEventListener('unhandledrejection', function(e) {
            console.error("Unhandled Promise Rejection:", e.reason);
        });
    </script>

    <script>
        window.coi = {
            // FIXED: Must be true for GitHub Pages to allow cross-origin isolation
            coepCredentialless: () => true
        };
    </script>
    <script src="coi-serviceworker.js"></script>

    <script>
        // ------------------------------------------------------------------
        // Lazy resource filesystem
        //
        // The manifest lists every resource path, but the resource contents are
        // NOT downloaded here. Instead, every path is registered as an Emscripten
        // lazy file. Endless Sky can therefore discover the normal filesystem
        // layout immediately, while the file contents are fetched only when the
        // native code actually opens/reads that file.
        //
        // This matches Endless Sky's normal Files::RecursiveList()/Files::Read()
        // model instead of eagerly copying the entire resource tree into MEMFS.
        // Emscripten's lazy-file implementation uses synchronous XHR, so the
        // generated build must access these files from a worker thread for modern
        // browsers. Endless Sky already performs its data/image/audio loading
        // through worker queues/threads in the normal build.
        // ------------------------------------------------------------------
        const RESOURCE_BASE = "resources/";
        const LAZY_CATEGORIES = ["data", "shaders", "images", "sounds"];

        function formatMB(bytes) { return (bytes / 1048576).toFixed(1) + " MB"; }

        const createdDirs = new Set();
        function ensureDir(fsRoot, relativeDir) {
            const key = fsRoot + "/" + relativeDir;
            if (!relativeDir || createdDirs.has(key))
                return;
            Module.FS_createPath("/", key, true, true);
            createdDirs.add(key);
        }

        function getLazyFileCreator() {
            if (typeof FS !== "undefined" && typeof FS.createLazyFile === "function")
                return FS.createLazyFile.bind(FS);
            if (typeof Module !== "undefined" && typeof Module.FS_createLazyFile === "function")
                return Module.FS_createLazyFile.bind(Module);
            throw new Error(
                "Emscripten FS.createLazyFile is not available. " +
                "Rebuild with the File System API exported, including createLazyFile."
            );
        }

        async function installLazyResources() {
            const manifestResponse = await fetch(RESOURCE_BASE + "manifest.json", { cache: "no-cache" });
            if (!manifestResponse.ok)
                throw new Error(
                    "Could not load " + RESOURCE_BASE + "manifest.json (HTTP " +
                    manifestResponse.status + ")"
                );

            const manifest = await manifestResponse.json();
            const createLazyFile = getLazyFileCreator();
            let fileCount = 0;
            let totalBytes = 0;

            for (const category of LAZY_CATEGORIES) {
                const entries = manifest[category] || [];
                if (!entries.length)
                    throw new Error(
                        "manifest.json lists no files for '" + category +
                        "'. Re-run make-manifest.py and check resources/" + category + "/."
                    );

                Module.FS_createPath("/", category, true, true);
                createdDirs.add(category);

                for (const [relativePath, size] of entries) {
                    const slash = relativePath.lastIndexOf("/");
                    const dir = slash < 0 ? "" : relativePath.slice(0, slash);
                    const name = slash < 0 ? relativePath : relativePath.slice(slash + 1);

                    ensureDir(category, dir);

                    const url = RESOURCE_BASE + category + "/" +
                        relativePath.split("/").map(encodeURIComponent).join("/");
                    const parent = "/" + category + (dir ? "/" + dir : "");

                    // Register the path only. The actual HTTP request happens on
                    // first file access, not during startup.
                    createLazyFile(parent, name, url, true, false);

                    ++fileCount;
                    totalBytes += size || 0;
                }
            }

            console.log(
                "[Resources] Installed " + fileCount +
                " lazy files (" + formatMB(totalBytes) + " available on demand)"
            );
            Module.setStatus("Starting Endless Sky...");
        }

        var Module = {
            canvas: document.getElementById("canvas"),

            // Runs before main(). We only need to download the manifest and create
            // lazy filesystem entries here. Resource contents are fetched when the
            // native code actually opens them.
            preRun: [function () {
                const dependency = "install_lazy_resources";
                Module.addRunDependency(dependency);
                installLazyResources().then(function () {
                    Module.removeRunDependency(dependency);
                }).catch(function (error) {
                    console.error("[Resources] " + (error && error.stack ? error.stack : error));
                    Module.setStatus("Failed to install lazy resources. See the log above.");
                    // Keep the dependency until the error is fixed so the engine does
                    // not start with a broken virtual filesystem.
                });
            }],

            setStatus: function(text) {
                var statusEl = document.getElementById("status");
                if (statusEl) {
                    if (text) {
                        statusEl.innerText = text;
                        console.log("[Status]", text);

                        // Emscripten reports "Running..." once main() has started.
                        // At that point the game canvas is active, so remove the
                        // full-screen debug overlay that was only intended to
                        // catch early startup failures.
                        if (text === "Running...") {
                            debugConsole.style.display = "none";
                            statusEl.style.display = "none";
                        }
                    } else {
                        statusEl.style.display = "none";
                    }
                }
            }
        };

        let gameScriptStarted = false;

        function loadGameScript() {
            if (gameScriptStarted) {
                console.warn("[Loader] Main engine load requested more than once; ignoring duplicate.");
                return;
            }
            gameScriptStarted = true;

            // Load only the generated engine runtime. Resources are installed as
            // lazy filesystem entries above, so there is no monolithic .data
            // package that should be fetched by this page.
            console.log("Cross-origin isolation confirmed. Injecting main engine...");

            var script = document.createElement("script");
            script.src = "endless-sky.js?t=" + new Date().getTime();
            script.async = false;
            document.body.appendChild(script);
        }
        if (window.crossOriginIsolated) {
            loadGameScript();
        } else {
            console.warn("[COI] Waiting for Cross-Origin Isolation reload...");
            setTimeout(function() {
                if (!window.crossOriginIsolated) {
                    console.error("Cross-Origin Isolation failed. Check browser restrictions.");
                    document.getElementById("status").innerText = 
                        "Cross-Origin Isolation failed. Check browser restrictions.";
                }
            }, 3000);
        }
    </script>
</body>
</html>
