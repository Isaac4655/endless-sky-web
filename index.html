<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endless Sky</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            outline: none;
        }

        #status {
            color: #fff;
            font-family: sans-serif;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
        }

        /* On-screen debug console */
        #debug-console {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            font-family: monospace;
            font-size: 14px;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            z-index: 9999;
            white-space: pre-wrap;
            word-wrap: break-word;
            display: block; /* Visible by default to catch early initialization */
        }
    </style>
</head>

<body>
    <div id="status">Loading environment hacks...</div>
    <div id="debug-console"></div>
    <canvas id="canvas" tabindex="0"></canvas>

    <!-- Logging Interceptor (MUST BE FIRST) -->
    <script>
        const debugConsole = document.getElementById('debug-console');
        
        function formatArgs(args) {
            return args.map(a => {
                if (a instanceof Error) return a.stack || a.message;
                if (typeof a === 'object') return JSON.stringify(a);
                return String(a);
            }).join(' ');
        }

        function printToScreen(msg, color) {
            const span = document.createElement('span');
            span.style.color = color;
            span.innerText = msg + '\n';
            debugConsole.appendChild(span);
            debugConsole.scrollTop = debugConsole.scrollHeight;
        }

        const origLog = console.log;
        console.log = function(...args) {
            origLog.apply(console, args);
            printToScreen(formatArgs(args), '#0f0'); // Green for standard logs
        };

        const origWarn = console.warn;
        console.warn = function(...args) {
            origWarn.apply(console, args);
            printToScreen(formatArgs(args), '#ff0'); // Yellow for warnings
        };

        const origError = console.error;
        console.error = function(...args) {
            origError.apply(console, args);
            printToScreen(formatArgs(args), '#f00'); // Red for errors
        };

        window.addEventListener('error', function(e) {
            console.error("Global Error:", e.message, "at", e.filename, ":", e.lineno);
        });

        window.addEventListener('unhandledrejection', function(e) {
            console.error("Unhandled Promise Rejection:", e.reason);
        });
    </script>

    <script>
        window.coi = {
            // FIXED: Must be true for GitHub Pages to allow cross-origin isolation
            coepCredentialless: () => true
        };
    </script>
    <script src="coi-serviceworker.js"></script>

    <script>
        if (WebAssembly.instantiateStreaming) {
            const originalInstantiateStreaming = WebAssembly.instantiateStreaming;
            WebAssembly.instantiateStreaming = function(response, imports) {
                if (imports && imports.env && imports.env.pthread_create) {
                    console.warn("[Hack] Intercepting imports.env.pthread_create (streaming)");
                    imports.env.pthread_create = function() { return 0; };
                }
                return originalInstantiateStreaming(response, imports);
            };
        }

        // ------------------------------------------------------------------
        // Resource streaming
        //
        // The Emscripten preload package (endless-sky.data) now holds only a few
        // tiny root files (credits, keys, license, ...). Everything else is fetched
        // here one file at a time from resources/<category>/... and written straight
        // into the virtual filesystem. Each downloaded buffer is dropped as soon as
        // it has been copied in, so the page never holds a full-size package blob.
        // Categories are streamed in the order listed, so the small, boot-critical
        // ones (data, shaders) arrive first and a problem with them shows up early.
        //
        // resources/manifest.json is produced by make-manifest.py:
        //   { "data": [["human/ships.txt", 1234], ...], "shaders": [ ... ],
        //     "images": [ ... ], "sounds": [ ... ] }
        // Paths are relative to resources/<category>/. Sizes are only used for
        // the progress display.
        // ------------------------------------------------------------------
        const RESOURCE_BASE = "resources/";
        const STREAM_CATEGORIES = ["data", "shaders", "images", "sounds"];  // each maps to /<category> in the game FS
        const FETCH_CONCURRENCY = 6;
        const FETCH_RETRIES = 3;

        function formatMB(bytes) { return (bytes / 1048576).toFixed(1) + " MB"; }

        async function fetchWithRetry(url) {
            let lastError;
            for (let attempt = 1; attempt <= FETCH_RETRIES; ++attempt) {
                try {
                    const response = await fetch(url);
                    if (!response.ok)
                        throw new Error("HTTP " + response.status);
                    return new Uint8Array(await response.arrayBuffer());
                } catch (error) {
                    lastError = error;
                    await new Promise(r => setTimeout(r, 250 * attempt));
                }
            }
            throw new Error("Failed to fetch " + url + ": " + lastError);
        }

        // Make every parent directory of a path exist in the game filesystem.
        const createdDirs = new Set();
        function ensureDir(fsRoot, relativeDir) {
            if (!relativeDir || createdDirs.has(fsRoot + "/" + relativeDir))
                return;
            Module.FS_createPath("/", fsRoot + "/" + relativeDir, true, true);
            createdDirs.add(fsRoot + "/" + relativeDir);
        }

        async function streamResources() {
            const manifestResponse = await fetch(RESOURCE_BASE + "manifest.json", { cache: "no-cache" });
            if (!manifestResponse.ok)
                throw new Error("Could not load " + RESOURCE_BASE + "manifest.json (HTTP " + manifestResponse.status + ")");
            const manifest = await manifestResponse.json();

            // Flatten into one work list.
            const jobs = [];
            let totalBytes = 0;
            for (const category of STREAM_CATEGORIES) {
                const entries = manifest[category] || [];
                // Starting the game with an empty data/ or shaders/ only produces confusing
                // errors much later, so refuse to continue if any category is empty.
                if (!entries.length)
                    throw new Error("manifest.json lists no files for '" + category
                        + "'. Re-run make-manifest.py and check resources/" + category + "/.");
                for (const [relativePath, size] of entries) {
                    jobs.push({ category, relativePath, size: size || 0 });
                    totalBytes += size || 0;
                }
            }

            console.log("[Resources] " + jobs.length + " files, " + formatMB(totalBytes) + " to stream");
            for (const category of STREAM_CATEGORIES)
                Module.FS_createPath("/", category, true, true);

            let nextJob = 0;
            let doneBytes = 0;
            let doneFiles = 0;
            let lastStatusUpdate = 0;

            async function worker() {
                while (true) {
                    const index = nextJob++;
                    if (index >= jobs.length)
                        return;
                    const job = jobs[index];
                    const slash = job.relativePath.lastIndexOf("/");
                    const dir = slash < 0 ? "" : job.relativePath.slice(0, slash);
                    const name = slash < 0 ? job.relativePath : job.relativePath.slice(slash + 1);

                    // Encode each path segment so names with spaces, '#', '%' or '@' survive.
                    const url = RESOURCE_BASE + job.category + "/"
                        + job.relativePath.split("/").map(encodeURIComponent).join("/");
                    const bytes = await fetchWithRetry(url);

                    ensureDir(job.category, dir);
                    // canRead=true, canWrite=false. The Uint8Array is copied into the FS, after
                    // which `bytes` goes out of scope and can be garbage collected.
                    Module.FS_createDataFile("/" + job.category + (dir ? "/" + dir : ""),
                        name, bytes, true, false, true);

                    doneBytes += bytes.length;
                    ++doneFiles;
                    const now = performance.now();
                    if (now - lastStatusUpdate > 150) {
                        lastStatusUpdate = now;
                        Module.setStatus("Loading resources... " + doneFiles + "/" + jobs.length
                            + " (" + formatMB(doneBytes) + " / " + formatMB(totalBytes) + ")");
                    }
                }
            }

            await Promise.all(Array.from({ length: FETCH_CONCURRENCY }, worker));
            console.log("[Resources] Done: " + doneFiles + " files, " + formatMB(doneBytes));
        }

        var Module = {
            canvas: document.getElementById("canvas"),

            // Runs on the main thread before main(). The run dependency keeps the
            // program from starting until every streamed file is in the filesystem.
            preRun: [function () {
                const dependency = "stream_resources";
                Module.addRunDependency(dependency);
                streamResources().then(function () {
                    Module.removeRunDependency(dependency);
                }).catch(function (error) {
                    console.error("[Resources] " + (error && error.stack ? error.stack : error));
                    Module.setStatus("Failed to load game resources. See the log above.");
                    // Deliberately do NOT remove the run dependency: starting the game with
                    // missing images and sounds would only produce confusing errors later.
                });
            }],

            setStatus: function(text) {
                var statusEl = document.getElementById("status");
                if (statusEl) {
                    if (text) {
                        statusEl.innerText = text;
                        console.log("[Status]", text);

                        // Emscripten reports "Running..." once main() has started.
                        // At that point the game canvas is active, so remove the
                        // full-screen debug overlay that was only intended to
                        // catch early startup failures.
                        if (text === "Running...") {
                            debugConsole.style.display = "none";
                            statusEl.style.display = "none";
                        }
                    } else {
                        statusEl.style.display = "none";
                    }
                }
            }
        };

        let gameScriptStarted = false;

        function loadGameScript() {
            if (gameScriptStarted) {
                console.warn("[Loader] Main engine load requested more than once; ignoring duplicate.");
                return;
            }
            gameScriptStarted = true;

            // The generated Emscripten main JS already contains the preload
            // runtime and will request endless-sky.data itself. Do NOT load
            // endless-sky.data.js separately, or the data preload run dependency
            // is registered twice and Emscripten aborts with an assertion.
            console.log("Cross-origin isolation confirmed. Injecting main engine...");

            var script = document.createElement("script");
            script.src = "endless-sky.js?t=" + new Date().getTime();
            script.async = false;
            document.body.appendChild(script);
        }
        if (window.crossOriginIsolated) {
            loadGameScript();
        } else {
            console.warn("[COI] Waiting for Cross-Origin Isolation reload...");
            setTimeout(function() {
                if (!window.crossOriginIsolated) {
                    console.error("Cross-Origin Isolation failed. Check browser restrictions.");
                    document.getElementById("status").innerText = 
                        "Cross-Origin Isolation failed. Check browser restrictions.";
                }
            }, 3000);
        }
    </script>
</body>
</html>
