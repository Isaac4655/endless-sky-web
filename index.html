<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endless Sky</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            outline: none;
        }

        #status {
            color: #fff;
            font-family: sans-serif;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
    </style>
</head>

<body>
    <div id="status">Loading environment hacks...</div>
    <canvas id="canvas" tabindex="0"></canvas>

    <script>
        window.coi = {
            coepCredentialless: () => false
        };
    </script>
    <script src="coi-serviceworker.js"></script>
    <script src="data-reassembler.js"></script>

    <script>
        // HACK 1: Force single-threaded fallback mode.
        // Endless Sky's C++ ThreadPool uses std::thread::hardware_concurrency().
        // By forcing it to 1, we may prevent it from trying to spawn background workers entirely.
        Object.defineProperty(navigator, 'hardwareConcurrency', {
            get: function() { return 1; }
        });

        // HACK 2: Bypass Emscripten's internal SharedArrayBuffer type checks.
        if (typeof SharedArrayBuffer === 'undefined') {
            console.warn("[Hack] Polyfilling SharedArrayBuffer to bypass JS checks");
            window.SharedArrayBuffer = window.ArrayBuffer;
        }

        // HACK 3: Intercept WebAssembly instantiation to neuter pthread_create.
        // If the JS runtime attempts to link pthread_create, we force it to return 0 (success) 
        // instead of 138 (ENOTSUP). This stops the C++ exception from aborting the program.
        const originalInstantiate = WebAssembly.instantiate;
        WebAssembly.instantiate = function(buffer, imports) {
            if (imports && imports.env && imports.env.pthread_create) {
                console.warn("[Hack] Intercepting imports.env.pthread_create");
                imports.env.pthread_create = function() { return 0; };
            }
            return originalInstantiate(buffer, imports);
        };

        if (WebAssembly.instantiateStreaming) {
            const originalInstantiateStreaming = WebAssembly.instantiateStreaming;
            WebAssembly.instantiateStreaming = function(response, imports) {
                if (imports && imports.env && imports.env.pthread_create) {
                    console.warn("[Hack] Intercepting imports.env.pthread_create (streaming)");
                    imports.env.pthread_create = function() { return 0; };
                }
                return originalInstantiateStreaming(response, imports);
            };
        }

        var Module = {
            canvas: document.getElementById("canvas"),
            setStatus: function(text) {
                var statusEl = document.getElementById("status");
                if (statusEl) {
                    if (text) {
                        statusEl.innerText = text;
                    } else {
                        statusEl.style.display = "none";
                    }
                }
            }
        };

        function loadGameScript() {
            var script = document.createElement("script");
            // Cache-bust to ensure we don't load a failed, cached script instance
            script.src = "endless-sky.js?t=" + new Date().getTime();
            document.body.appendChild(script);
        }

        if (window.crossOriginIsolated) {
            loadGameScript();
        } else {
            console.warn("[COI] Waiting for Cross-Origin Isolation reload...");
            setTimeout(function() {
                if (!window.crossOriginIsolated) {
                    document.getElementById("status").innerText = 
                        "Cross-Origin Isolation failed. Check browser restrictions.";
                }
            }, 3000);
        }
    </script>
</body>
</html>
